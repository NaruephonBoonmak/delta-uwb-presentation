.w,.box,.group,.rule{fill:none;stroke:#111;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.box{fill:#fff;stroke-width:1.6}.group{stroke-width:1.35;stroke-dasharray:6 5}.rule{stroke-width:.8}
</style>
